<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="40" y1="20" x2="1360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06131B"/>
      <stop offset="0.52" stop-color="#081C27"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>

    <radialGradient id="yellowAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 210) rotate(15) scale(260 180)">
      <stop offset="0" stop-color="#FFC328" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFC328" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 100) rotate(-20) scale(360 180)">
      <stop offset="0" stop-color="#5BE8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5BE8FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassPanel" x1="90" y1="60" x2="500" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF8FF" stop-opacity="0.18"/>
      <stop offset="0.38" stop-color="#A3EEFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFE9AA" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="frameStroke" x1="120" y1="95" x2="470" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FDFF" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#66EBFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFD15A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nFront" x1="178" y1="104" x2="384" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEAA8"/>
      <stop offset="0.45" stop-color="#FFC536"/>
      <stop offset="1" stop-color="#E89A00"/>
    </linearGradient>

    <linearGradient id="nEdge" x1="170" y1="88" x2="396" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8D2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#C97700" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="520" y1="150" x2="1250" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.6" stop-color="#ECF6FA"/>
      <stop offset="1" stop-color="#CDE6EE"/>
    </linearGradient>

    <linearGradient id="subline" x1="520" y1="262" x2="1080" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CEEFF"/>
      <stop offset="0.45" stop-color="#D5F7FF"/>
      <stop offset="1" stop-color="#FFD25A"/>
    </linearGradient>

    <filter id="outerGlow" x="26" y="20" width="1348" height="380" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="28" result="blurGlow"/>
    </filter>

    <filter id="glassBlur" x="70" y="50" width="450" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="BackgroundImageFix" stdDeviation="8"/>
      <feComposite in2="SourceAlpha" operator="in" result="effect1_backgroundBlur"/>
      <feBlend mode="normal" in="SourceGraphic" in2="effect1_backgroundBlur" result="shape"/>
      <feGaussianBlur stdDeviation="0.6" result="effect2_innerShadow"/>
    </filter>

    <filter id="nGlow" x="130" y="70" width="300" height="300" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#FFD250" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#5BE8FF" flood-opacity="0.25"/>
    </filter>

    <filter id="textGlow" x="500" y="110" width="850" height="250" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#65EAFF" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFC432" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#yellowAura)"/>
  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#cyanAura)"/>

  <g filter="url(#outerGlow)" opacity="0.72">
    <rect x="84" y="66" width="412" height="288" rx="30" fill="rgba(255,255,255,0.04)"/>
  </g>

  <g filter="url(#glassBlur)">
    <rect x="92" y="74" width="396" height="272" rx="28" fill="url(#glassPanel)"/>
    <rect x="92.75" y="74.75" width="394.5" height="270.5" rx="27.25" stroke="url(#frameStroke)" stroke-opacity="0.72" stroke-width="1.5"/>

    <path d="M125 112H180V306H125V112Z" fill="none" stroke="#EAF9FF" stroke-opacity="0.95" stroke-width="8"/>
    <path d="M404 112H349V306H404V112Z" fill="none" stroke="#EAF9FF" stroke-opacity="0.95" stroke-width="8"/>
    <path d="M125 112H176L349 265V306H298L125 153V112Z" fill="url(#nEdge)" opacity="0.42"/>
  </g>

  <g filter="url(#nGlow)">
    <path d="M160 110H214V300H160V110Z" fill="url(#nFront)"/>
    <path d="M314 110H368V300H314V110Z" fill="url(#nFront)"/>
    <path d="M214 110H270L314 160V246L258 196L214 146V110Z" fill="url(#nFront)"/>
    <path d="M214 198L258 248V300H214V198Z" fill="url(#nFront)"/>

    <path d="M160 110L176 98H230L214 110H160Z" fill="#FFF2C2" opacity="0.55"/>
    <path d="M314 110L330 98H384L368 110H314Z" fill="#FFF2C2" opacity="0.55"/>
    <path d="M214 110L230 98H286L270 110H214Z" fill="#FFF2C2" opacity="0.45"/>
  </g>

  <path d="M105 96C146 82 216 77 277 84" stroke="#72EEFF" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M314 322C366 330 424 321 471 296" stroke="#FFE48A" stroke-opacity="0.4" stroke-width="2"/>

  <g filter="url(#textGlow)">
    <text x="540" y="200" fill="url(#wordmark)" font-family="Syne, Montserrat, Poppins, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="1.4">NEXCORE</text>
    <text x="540" y="285" fill="url(#subline)" fill-opacity="0.96" font-family="DM Sans, Montserrat, Poppins, Arial, sans-serif" font-size="58" font-weight="500" letter-spacing="2.8">SOLUTIONS</text>
  </g>

  <rect x="112" y="94" width="356" height="232" rx="22" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <circle cx="1120" cy="108" r="3" fill="#6DEBFF" fill-opacity="0.6"/>
  <circle cx="1088" cy="338" r="2.7" fill="#FFD36A" fill-opacity="0.62"/>
</svg>
